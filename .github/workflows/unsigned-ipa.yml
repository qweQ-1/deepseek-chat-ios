# 打一个不签名的 IPA，供 AltStore / Sideloadly / 轻松签 用免费 Apple ID 自签安装。
# 顺便把 App 图标也生成出来（在 runner 上画，不占用手机内存）。
name: Unsigned IPA

on:
  push:
    branches: [deepseek-chat]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -oq "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate app icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/iconenv"
          "$RUNNER_TEMP/iconenv/bin/pip" install --quiet --disable-pip-version-check pillow
          "$RUNNER_TEMP/iconenv/bin/python" Tools/make_icons.py
          ls -lh DeepSeekChat/Assets.xcassets/AppIcon.appiconset/

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen --version
          xcodegen generate

      - name: Archive without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project DeepSeekChat.xcodeproj -scheme DeepSeekChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DeepSeekChat.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            2>&1 | tail -40

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/DeepSeekChat.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d -print -quit)
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          test -f "$APP/Web/index.html" || { echo "bundle 里没有 Web/index.html"; exit 1; }
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          codesign --force --sign - "dist/Payload/$(basename "$APP")" || true
          (cd dist && zip -qry DeepSeekChat-unsigned.ipa Payload)
          shasum -a 256 dist/DeepSeekChat-unsigned.ipa
          ls -lh dist/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: deepseekchat-unsigned-ipa
          path: dist/DeepSeekChat-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deepseek-chat-latest
          name: DeepSeek Chat iOS（unsigned IPA）
          body: |
            用 DeepSeek 官方开源的 chat-demo 前端封装的 iOS App，聊天请求由本机直连 `https://api.deepseek.com`。

            - 未签名，需 AltStore / Sideloadly / 轻松签 自签安装
            - 首次启动填写自己的 API Key
            - 构建号：${{ github.run_number }}
          files: dist/DeepSeekChat-unsigned.ipa
          fail_on_unmatched_files: true
